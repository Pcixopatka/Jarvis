name: Тести

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.1-stable
    steps:
      - uses: actions/checkout@v4

      - name: Кеш Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Завантажити Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          # Повтори на випадок тимчасових збоїв мережі; --fail не дає зберегти сторінку помилки замість архіву
          FILE="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${FILE}" \
          || curl -fsSL --retry 3 --retry-delay 10 -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${FILE}"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: Імпорт проєкту
        run: ./godot --headless --import || true

      - name: Перевірка компіляції скриптів
        run: ./godot --headless --path . -s res://tests/check_scripts.gd

      - name: Автотести
        run: |
          set -o pipefail
          ./godot --headless --path . -s res://tests/run_tests.gd --fixed-fps 60 2>&1 | tee tests.log
          # Помилка скрипту посеред набору обриває його без провалу перевірок, тому ловимо її окремо
          if grep -q "SCRIPT ERROR" tests.log; then
            echo "Під час тестів були помилки скриптів"
            exit 1
          fi
